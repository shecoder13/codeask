[project]
name = "codeask-env"
version = "0.0.0"
description = "Environment for codeask (dependencies only)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=0.40",
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
